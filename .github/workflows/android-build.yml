name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 18
      JAVA_VERSION: 11
      ANDROID_API_LEVEL: 33
      ANDROID_BUILD_TOOLS: 33.0.2

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK (install required components)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          force-avd-creation: false

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Initialize Capacitor (if not already)
        run: |
          npx cap init talkme com.example.talkme --web-dir=dist || true

      - name: Add Android platform (if not exists)
        run: |
          npx cap add android || true

      - name: Copy web assets to Android
        run: npx cap copy android

      - name: Add microphone and camera permissions (if manifest exists)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ -f "$MANIFEST" ]; then
            grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST" || sed -i "/<manifest /a \    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />" $MANIFEST
            grep -q 'android.permission.CAMERA' "$MANIFEST" || sed -i "/<manifest /a \    <uses-permission android:name=\"android.permission.CAMERA\" />" $MANIFEST
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
